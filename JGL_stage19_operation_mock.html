<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Juglog 工程19 操作見本</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#10271e,#203d30);color:#fff;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:450px;margin:auto;padding:16px 12px 130px}h1{font-size:20px;margin:10px 0}small,p{color:#c1d4c9}p{font-size:13px;line-height:1.5}button,select{font:inherit;color:#fff;background:#385449;border:1px solid #718a7c;border-radius:12px;min-height:46px;touch-action:manipulation}button:disabled{opacity:.35}button:active{filter:brightness(1.3)}.card{padding:12px;background:#ffffff0c;border:1px solid #ffffff26;border-radius:15px;margin:10px 0}.row{display:flex;gap:8px}.row>*{flex:1}.count{font-size:28px;font-weight:700;display:block}.big{min-height:84px;font-weight:bold}.bb{background:#7d343b}.rb{background:#344c80}.green{background:#3f6550}.gold{background:#7b622c}.value{font-size:34px;font-weight:bold;text-align:center;display:block;padding:10px}.wide{width:100%}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.keys button{min-height:47px;font-size:22px}.fixed{position:fixed;bottom:55px;left:50%;transform:translateX(-50%);width:min(426px,calc(100% - 24px));background:#182e24;padding:8px;border-radius:14px;box-shadow:0 4px 20px #0008}.fixed button{width:100%}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(450px,100%);display:flex;justify-content:space-around;background:#10271e;padding:14px 4px;font-size:12px;color:#b8c8bf}dialog{width:min(425px,calc(100% - 24px));max-height:calc(100dvh - 24px);overflow:auto;background:#203b30;color:white;border:1px solid #729481;border-radius:16px;padding:16px}dialog::backdrop{background:#0009}h2{font-size:19px;margin:0 0 12px}label{display:block;font-size:14px;margin:10px 0 5px}select{width:100%;padding:8px} [hidden]{display:none!important}#status{min-height:20px}.hint{font-size:12px;color:#bcd1c4}.top{font-size:12px;color:#e9c685}#current{width:100%;font-size:30px;font-weight:700}.stats{display:flex;justify-content:space-between;font-size:13px}.stats b{display:block;font-size:23px} 
</style></head><body><main><div class="top">工程19・独立操作見本／実戦データ未接続</div><h1>実戦カウント</h1><div class="card stats"><div>本人累計G<b id="total">125</b></div><div>現在G<b id="cur">125</b></div><div>状態<b id="mode" style="font-size:16px">通常</b></div></div><div class="card"><label>現在G（タップして入力）</label><button id="current">125 G</button><div class="row" style="margin-top:8px"><button data-delta="50">+50</button><button data-delta="100">+100</button><button data-delta="-10">−10</button></div><p class="hint">テンキー確定で直接記録</p></div><div class="card"><div class="row"><button class="big bb" id="bb">BB<span class="count" id="bbN">0</span></button><button class="big rb" id="rb">RB<span class="count" id="rbN">0</span></button></div><div class="row" style="margin-top:8px"><button class="big green" id="grape">🍇 ぶどう<span class="count" id="grapeN">0</span></button><button class="big gold" id="cherry">🍒 チェリー<span class="count" id="cherryN">0</span></button></div></div><p id="status" role="status"></p><button id="reset" class="wide">見本を初期状態に戻す</button><p>架空の数値で操作順序を確認する見本です。実機の保存処理・デザインを再現したものではありません。</p></main><div class="fixed" id="fixed" hidden><button id="finish" class="green">ボーナス終了・0Gに戻す</button><button id="undo" style="margin-top:6px">当選取り消し</button></div><div class="nav"><b>実戦</b><span>推測</span><span>グラフ</span><span>履歴</span><span>設定</span></div><dialog id="award"><h2 id="heading">BB当選</h2><label>当選ゲーム数</label><button class="wide value" id="awardG">125 G</button><div class="hint">数字をタップして修正</div><label for="trigger">当選契機</label><select id="trigger"><option>不明・判別できず</option><option>単独（確認済み）</option><option>チェリー重複（確認済み）</option></select><div class="row" style="margin-top:14px"><button id="cancelAward">キャンセル</button><button id="saveAward" class="green">当選を記録</button></div></dialog><dialog id="keypad"><h2>現在Gを入力</h2><output class="value" id="digits"></output><div class="keys" id="keys"></div><div class="row" style="margin-top:10px"><button id="cancelKey">キャンセル</button><button id="saveKey" class="green">確定</button></div></dialog><dialog id="undoDialog"><h2>当選を取り消しますか？</h2><p>当選記録だけを取り消し、入力したゲーム数は保持する見本です。</p><div class="row"><button id="cancelUndo">戻る</button><button id="confirmUndo">取り消す</button></div></dialog><script>
'use strict';const $=id=>document.getElementById(id);let g=125,total=125,bb=0,rb=0,grape=0,cherry=0,active=null,draft=125,kind=null,keyContext=null,buffer='';function render(){for(const [id,v] of Object.entries({total,cur:g,bbN:bb,rbN:rb,grapeN:grape,cherryN:cherry,mode:active?active+'消化中':'通常',current:g+' G'}))$(id).textContent=v;for(const id of ['bb','rb','grape','cherry','current'])$(id).disabled=!!active;document.querySelectorAll('[data-delta]').forEach(b=>b.disabled=!!active);$('fixed').hidden=!active}function change(n){if(!Number.isSafeInteger(n)||n<0||n>9999999||total+n-g<0)return false;total+=n-g;g=n;return true}function msg(s){$('status').textContent=s}function openAward(k){if(active)return;kind=k;draft=g;$('heading').textContent=k+'当選';$('awardG').textContent=draft+' G';$('trigger').selectedIndex=0;$('award').showModal()}function openKey(ctx){keyContext=ctx;buffer=String(ctx==='award'?draft:g);$('digits').textContent=buffer;$('keypad').showModal()}for(const k of ['1','2','3','4','5','6','7','8','9','C','0','⌫']){let b=document.createElement('button');b.textContent=k;b.onclick=()=>{buffer=k==='C'?'':k==='⌫'?buffer.slice(0,-1):(buffer+k).replace(/^0+(?=\d)/,'').slice(0,7);$('digits').textContent=buffer||'0'};$('keys').append(b)}$('current').onclick=()=>openKey('normal');$('awardG').onclick=()=>openKey('award');$('cancelKey').onclick=()=>$('keypad').close();$('saveKey').onclick=()=>{let n=Number(buffer||'0');if(keyContext==='award'){draft=n;$('awardG').textContent=n+' G'}else if(!active&&change(n)){render();msg('現在Gを記録しました')} $('keypad').close()};$('bb').onclick=()=>openAward('BB');$('rb').onclick=()=>openAward('RB');$('cancelAward').onclick=()=>$('award').close();$('saveAward').onclick=()=>{if(active||!change(draft))return;active=kind;if(kind==='BB')bb++;else rb++;$('award').close();render();msg(kind+'当選を記録しました')};$('finish').onclick=()=>{if(!active)return;active=null;g=0;render();msg('ボーナス終了・0Gに戻しました')};$('undo').onclick=()=>$('undoDialog').showModal();$('cancelUndo').onclick=()=>$('undoDialog').close();$('confirmUndo').onclick=()=>{if(active==='BB')bb--;else if(active==='RB')rb--;active=null;$('undoDialog').close();render();msg('当選を取り消しました')};document.querySelectorAll('[data-delta]').forEach(b=>b.onclick=()=>{if(!active&&change(Math.max(0,g+Number(b.dataset.delta))))render()});$('grape').onclick=()=>{if(!active){grape++;render()}};$('cherry').onclick=()=>{if(!active){cherry++;render()}};$('reset').onclick=()=>{g=total=125;bb=rb=grape=cherry=0;active=null;render();msg('初期状態に戻しました')};render();
</script></body></html>
